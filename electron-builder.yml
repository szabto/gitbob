appId: app.gitbob.desktop
productName: GitBob
copyright: Copyright © 2026 GitBob
directories:
  output: release/${version}
  buildResources: resources
files:
  - out/**
  - package.json
  - "!**/*.map"
extraResources:
  - from: resources/icon.png
    to: icon.png
asar: true
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.png
  target: [dmg, zip]
  # Until a Developer ID certificate is configured (see docs/RELEASING.md), sign ad-hoc ("-"):
  # electron-builder modifies the bundle, and an unsigned/stale signature makes macOS on Apple
  # Silicon kill the app at launch. Hardened runtime needs a real identity plus entitlements,
  # so it is enabled together with Developer ID signing.
  identity: '-'
  hardenedRuntime: false
dmg:
  title: GitBob ${version}
win:
  icon: resources/icon.png
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: resources/icon.png
  category: Development
  target: [AppImage, deb]
  maintainer: Tamás <szabto@gmail.com>
  synopsis: Free desktop Git client
  executableName: gitbob
publish:
  provider: github
  owner: szabto
  repo: gitbob
  releaseType: release
artifactName: GitBob-${os}-${arch}.${ext}
