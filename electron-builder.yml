appId: app.gitbob.desktop
productName: GitBob
copyright: Copyright © 2026 GitBob
directories:
  output: release/${version}
  buildResources: resources
files:
  - out/**
  - package.json
  - "!**/*.map"
extraResources:
  - from: resources/icon.png
    to: icon.png
asar: true
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.png
  target: [dmg, zip]
  # Signing/notarization are configured in CI with Developer ID credentials (not set up yet).
  identity: null
  hardenedRuntime: true
dmg:
  title: GitBob ${version}
win:
  icon: resources/icon.png
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: resources/icon.png
  category: Development
  target: [AppImage, deb]
  maintainer: Tamás <szabto@gmail.com>
  synopsis: Free desktop Git client
  executableName: gitbob
publish:
  provider: github
  owner: szabto
  repo: gitbob
  releaseType: prerelease
artifactName: GitBob-${version}-${os}-${arch}.${ext}
